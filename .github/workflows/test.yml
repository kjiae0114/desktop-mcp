name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # 실제 화면 조작은 가짜 GUI로 대체되고, Docker 테스트 이미지가 없으므로
    # Docker 통합 테스트는 tests/test_sandbox.py의 docker_only 표시에 따라 자동으로 건너뛴다.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: python -m pip install -r requirements.txt pytest

      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -rs

  linux-sandbox:
    # 에이전트는 테스트를 Docker(Linux) 샌드박스에서 돌린다. Windows에서만 맞는 테스트가 들어오면
    # 에이전트가 '작업 전부터 테스트가 실패합니다'로 멈추므로(2026-11-06 실제 발생) Linux에서도 확인한다.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: python -m pip install -r requirements.txt pytest

      - name: 샌드박스 이미지 빌드
        run: docker build -t desktop-mcp-sandbox:py312 -f sandbox/python.Dockerfile .

      - name: 에이전트 기준 테스트 재현 (샌드박스 안에서 전체 테스트)
        run: python scripts/sandbox_baseline.py

      - name: 전체 테스트 (Linux, Docker 통합 테스트 포함)
        run: python -m pytest -rs
